name: Integration

# Exercises the package as PUBLISHED on npm, against staging. CI covers this
# working tree; nothing there would notice a `files` list that ships no `dist`,
# an export map a consumer cannot resolve, or a release that never landed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '17 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # npm, not pnpm, and no cache: the point is the install a stranger gets.
      # The script skips with a reason when nothing is published yet, or runs
      # the keyless half when the secret is missing.
      - run: node scripts/run.mjs
        working-directory: integration
        env:
          VPNDETECTION_STAGING_KEY: ${{ secrets.VPNDETECTION_STAGING_KEY }}
